<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Expedition" />
  <title>The Daily Expedition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #1a1814;
      --ink-mid: #4a4640;
      --ink-light: #8a857e;
      --ink-faint: #c8c3bc;
      --paper: #f9f6f0;
      --paper-warm: #f2ede4;
      --rule: #d8d2c8;
      --accent: #8b1a1a;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --max: 680px;
      --pad: clamp(1.25rem, 5vw, 2.5rem);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8df;
        --ink-mid: #b8b2a8;
        --ink-light: #7a756e;
        --ink-faint: #3a3630;
        --paper: #18160f;
        --paper-warm: #1e1b12;
        --accent: #c9433a;
        --rule: #2e2b22;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .masthead {
      padding-top: max(1.5rem, calc(env(safe-area-inset-top) + 1rem));
    }

    .masthead-inner {
      border-top: 3px double var(--ink);
      border-bottom: 1px solid var(--rule);
      padding: 0.5rem 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .masthead-title {
      font-family: var(--font-display);
      font-size: clamp(13px, 2.5vw, 15px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .masthead-date {
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
    }

    #view-main, #view-explore {
      padding-top: 2rem;
      padding-bottom: max(3rem, calc(env(safe-area-inset-bottom) + 2rem));
    }

    #view-explore { display: none; }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.75rem;
    }

    .domain-pill {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    .doorway-headline {
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .doorway-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.75;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .doorway-body p + p { margin-top: 0.85rem; }

    .section-rule {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2rem 0;
    }

    .questions-list { list-style: none; }

    .question-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .question-row:first-child { border-top: 1px solid var(--rule); }
    .question-row:active { opacity: 0.6; }

    .question-tag {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-light);
      min-width: 80px;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .question-text {
      font-size: clamp(14px, 2.2vw, 16px);
      line-height: 1.5;
      color: var(--ink);
      flex: 1;
    }

    .question-arrow {
      color: var(--ink-faint);
      padding-top: 1px;
      flex-shrink: 0;
      transition: transform 0.15s, color 0.15s;
    }

    .question-row:hover .question-arrow { transform: translateX(3px); color: var(--accent); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 1.75rem;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--ink); }

    .explore-question {
      font-family: var(--font-display);
      font-size: clamp(19px, 4vw, 25px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      color: var(--ink);
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .explore-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.8;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .explore-body p + p { margin-top: 1rem; }

    .explore-body h3 {
      font-family: var(--font-display);
      font-size: clamp(16px, 2.8vw, 19px);
      font-weight: 500;
      font-style: italic;
      color: var(--ink);
      margin: 1.75rem 0 0.6rem;
      line-height: 1.3;
    }

    .detour-section {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }

    .detour-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.85rem;
    }

    .detour-chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .detour-chip {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 300;
      color: var(--ink-mid);
      border: 1px solid var(--rule);
      background: none;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .detour-chip:hover { border-color: var(--ink-mid); color: var(--ink); }
    .detour-chip:active { background: var(--paper-warm); }

    .reflection {
      margin-top: 2.5rem;
      padding: 1.25rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--paper-warm);
    }

    .reflection-prompt {
      font-family: var(--font-display);
      font-size: clamp(15px, 2.5vw, 17px);
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }

    .reflection-sub {
      font-size: 13px;
      color: var(--ink-light);
      font-weight: 300;
      line-height: 1.6;
    }

    .skeleton {
      background: var(--paper-warm);
      border-radius: 2px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .sk-hl  { height: 32px; width: 88%; margin-bottom: 10px; }
    .sk-hl2 { height: 32px; width: 62%; margin-bottom: 20px; }
    .sk-ln  { height: 14px; margin-bottom: 10px; }
    .w-100  { width: 100%; }
    .w-85   { width: 85%; }
    .w-72   { width: 72%; }

    .sk-row {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      align-items: center;
    }
    .sk-row:first-child { border-top: 1px solid var(--rule); }
    .sk-tag { height: 10px; width: 70px; flex-shrink: 0; }
    .sk-q   { height: 14px; flex: 1; }

    .error-msg {
      font-size: 15px;
      color: var(--ink-light);
      font-style: italic;
      line-height: 1.7;
      padding: 1rem 0;
    }

    .error-detail {
      display: block;
      margin-top: 0.5rem;
      font-size: 12px;
      opacity: 0.6;
      font-style: normal;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead-inner">
        <span class="masthead-title">The Daily Expedition</span>
        <span class="masthead-date" id="js-date"></span>
      </div>
    </header>

    <main id="view-main">
      <section id="js-doorway" style="padding-top:2rem">
        <div class="skeleton sk-hl"></div>
        <div class="skeleton sk-hl2"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-85"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-72"></div>
      </section>

      <hr class="section-rule" style="margin-top:2rem" />

      <section style="padding-bottom:3rem">
        <p class="eyebrow">Threads worth pulling</p>
        <ul class="questions-list" id="js-questions">
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-85"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-72"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-85"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-72"></div></li>
        </ul>
      </section>
    </main>

    <div id="view-explore" style="padding-top:2rem;padding-bottom:max(3rem,calc(env(safe-area-inset-bottom)+2rem))">
      <button class="back-btn" onclick="showMain()">← Today's expedition</button>
      <div id="js-explore-content"></div>
    </div>
  </div>

  <script>
    let expedition = null;

    const DETOURS = [
      'Simply explained',
      'Go technical',
      'Economic lens',
      'Historical roots',
      'Opposing views',
      'Second-order effects',
    ];

    // Date
    (function() {
      const d = new Date();
      document.getElementById('js-date').textContent =
        d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    })();

    // API calls
    async function fetchNews() {
      const res = await fetch('/.netlify/functions/news');
      if (!res.ok) throw new Error('News fetch failed: ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.news || [];
    }

    async function callGemini(systemPrompt, userPrompt, expectJson) {
      const res = await fetch('/.netlify/functions/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemPrompt, userPrompt, expectJson: !!expectJson }),
      });
      if (!res.ok) throw new Error('Gemini call failed: ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.text || '';
    }

    // Parse JSON robustly — strips markdown fences if present
    function parseJson(raw) {
      // Try direct parse first
      try { return JSON.parse(raw); } catch (_) {}
      // Strip markdown fences and retry
      const stripped = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
      try { return JSON.parse(stripped); } catch (_) {}
      // Extract first {...} block and retry
      const match = stripped.match(/\{[\s\S]*\}/);
      if (match) return JSON.parse(match[0]);
      throw new Error('Could not parse JSON from Gemini response.');
    }

    // Build expedition from headlines
    async function buildExpedition(articles) {
      const digest = articles.slice(0, 20)
        .map((a, i) => `${i+1}. [${(a.category||[]).join(', ')}] ${a.title}`)
        .join('\n');

      const systemPrompt = `You are the editor of The Daily Expedition — a calm, intellectually serious daily briefing. Your reader is educated and broadly curious across geopolitics, economics, technology, science, energy, infrastructure, history, and culture.

Today is ${new Date().toDateString()}. You have been given a list of real headlines from today's news. Your task:
1. Choose the single most intellectually rich story — one that connects to larger systems, has historical depth, and opens multiple avenues of exploration. Avoid sports and pure celebrity news.
2. Write a compelling doorway into that story.
3. Generate six genuinely interesting questions it opens.

You MUST respond with only a valid JSON object. No explanation, no markdown, no code fences. Raw JSON only.

Schema:
{
  "headline": "A sharp newspaper-quality headline",
  "domain_tag": "one of: Geopolitics | Economics | Technology | Science | Energy | Infrastructure | Culture | History",
  "doorway": "Three to four sentences. Set the scene with authority. What happened, why it matters, what is genuinely uncertain. Write like a senior correspondent.",
  "questions": [
    { "tag": "Historical",   "text": "A question about how history led to this moment" },
    { "tag": "Systemic",     "text": "A question about the larger system or mechanism at play" },
    { "tag": "Geopolitical", "text": "A question about actors, power, and incentives" },
    { "tag": "Economic",     "text": "A question about market forces or financial consequences" },
    { "tag": "Scientific",   "text": "A question about the underlying technology or science" },
    { "tag": "Wildcard",     "text": "An unexpected adjacent question that becomes fascinating because of this event" }
  ]
}`;

      const userPrompt = `Here are today's headlines. Choose the best doorway and generate the expedition JSON:\n\n${digest}`;
      const raw = await callGemini(systemPrompt, userPrompt, true);
      return parseJson(raw);
    }

    // Render
    function renderDoorway(data) {
      document.getElementById('js-doorway').innerHTML = `
        <p class="eyebrow">Today's doorway</p>
        <span class="domain-pill">${esc(data.domain_tag)}</span>
        <h1 class="doorway-headline">${esc(data.headline)}</h1>
        <div class="doorway-body"><p>${esc(data.doorway)}</p></div>
      `;
    }

    function renderQuestions(data) {
      document.getElementById('js-questions').innerHTML = data.questions.map((q, i) => `
        <li class="question-row" onclick="openQuestion(${i})" role="button" tabindex="0"
            onkeydown="if(event.key==='Enter')openQuestion(${i})">
          <span class="question-tag">${esc(q.tag)}</span>
          <span class="question-text">${esc(q.text)}</span>
          <span class="question-arrow">→</span>
        </li>
      `).join('');
    }

    async function openQuestion(idx, detour) {
      const q = expedition.questions[idx];

      document.getElementById('view-main').style.display = 'none';
      document.getElementById('view-explore').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'instant' });

      const label = detour ? `${detour} — ${q.text}` : q.text;

      document.getElementById('js-explore-content').innerHTML = `
        <p class="explore-question">${esc(label)}</p>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-85" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-72" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-85"></div>
      `;

      const lensGuide = {
        'Simply explained':    'Explain this for a curious intelligent non-specialist. Use concrete analogies. Avoid jargon.',
        'Go technical':        'Go deep into the technical or scientific mechanisms. Assume a well-educated reader who wants precision.',
        'Economic lens':       'Focus on economic dimensions — incentives, market structures, costs, trade-offs, consequences.',
        'Historical roots':    'Ground this in history. How did we arrive here? What are the deep roots and precedents?',
        'Opposing views':      'Present genuine tensions and disagreements. Where do serious thoughtful people disagree, and why?',
        'Second-order effects':'Think through downstream consequences. What might this change over 5–20 years?',
      };

      const lensNote = detour ? `\n\nLens: ${lensGuide[detour] || detour}` : '';

      const systemPrompt = `You are a brilliant, measured intellectual guide for The Daily Expedition. You write with the depth and craft of a long-form magazine feature — flowing prose, not bullet points.

Today's event: "${expedition.headline}"
Context: ${expedition.doorway}

Write 4–5 substantive paragraphs exploring the question. Use a subheading only if genuinely needed. Every paragraph should reveal something. End with one sentence that opens a new direction, leaving the reader curious.${lensNote}`;

      const userPrompt = `Explore this question with depth and care: "${q.text}"`;

      try {
        const answer = await callGemini(systemPrompt, userPrompt, false);
        renderExploration(q, answer, idx, detour);
      } catch (err) {
        document.getElementById('js-explore-content').innerHTML = `
          <p class="explore-question">${esc(label)}</p>
          <p class="error-msg">Could not load this exploration.
            <span class="error-detail">${esc(err.message)}</span>
          </p>
        `;
      }
    }

    function renderExploration(q, rawText, idx, detour) {
      const html = rawText
        .replace(/\r\n/g, '\n')
        .split(/\n{2,}/)
        .map(block => {
          const t = block.trim();
          if (!t) return '';
          if (/^#{1,3}\s+/.test(t)) return `<h3>${esc(t.replace(/^#{1,3}\s+/, ''))}</h3>`;
          return `<p>${esc(t.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1'))}</p>`;
        })
        .filter(Boolean).join('\n');

      const chips = DETOURS
        .filter(d => d !== detour)
        .map(d => `<button class="detour-chip" onclick="openQuestion(${idx},'${escAttr(d)}')">${esc(d)}</button>`)
        .join('');

      document.getElementById('js-explore-content').innerHTML = `
        <p class="explore-question">${esc(detour ? detour + ' — ' + q.text : q.text)}</p>
        <div class="explore-body">${html}</div>
        <div class="detour-section">
          <p class="detour-label">Explore through a different lens</p>
          <div class="detour-chips">${chips}</div>
        </div>
        <div class="reflection">
          <p class="reflection-prompt">"What do you understand now that you didn't understand this morning?"</p>
          <p class="reflection-sub">The expedition is most valuable when it changes how you see a system — not just what you know about an event.</p>
        </div>
      `;
    }

    function showMain() {
      document.getElementById('view-explore').style.display = 'none';
      document.getElementById('view-main').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function escAttr(str) { return String(str).replace(/'/g, "\\'"); }

    async function init() {
      const todayKey = 'expedition-' + new Date().toISOString().slice(0, 10);

      // Try loading from cache first
      try {
        const cached = localStorage.getItem(todayKey);
        if (cached) {
          expedition = JSON.parse(cached);
          renderDoorway(expedition);
          renderQuestions(expedition);
          return;
        }
      } catch (_) {}

      // Nothing cached — fetch fresh
      try {
        const articles = await fetchNews();
        if (!articles.length) throw new Error('No articles returned from news API.');
        expedition = await buildExpedition(articles);
        // Save to cache
        try { localStorage.setItem(todayKey, JSON.stringify(expedition)); } catch (_) {}
        renderDoorway(expedition);
        renderQuestions(expedition);
      } catch (err) {
        document.getElementById('js-doorway').innerHTML = `
          <p class="error-msg">The expedition couldn't load today — this is usually a configuration issue.
            Double-check that both API keys are set in your Netlify environment variables.
            <span class="error-detail">${esc(err.message)}</span>
          </p>
        `;
        document.getElementById('js-questions').innerHTML = '';
      }
    }

    init();
  </script>
</body>
</html>
