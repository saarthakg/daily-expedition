<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Expedition" />
  <meta name="theme-color" content="#8b1a1a" />
  <meta name="description" content="A daily briefing that turns one real news story into a calm, magazine-style intellectual expedition." />
  <title>The Daily Expedition</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #1a1814;
      --ink-mid: #4a4640;
      --ink-light: #8a857e;
      --ink-faint: #c8c3bc;
      --paper: #f9f6f0;
      --paper-warm: #f2ede4;
      --rule: #d8d2c8;
      --accent: #8b1a1a;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --max: 680px;
      --pad: clamp(1.25rem, 5vw, 2.5rem);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8df;
        --ink-mid: #b8b2a8;
        --ink-light: #7a756e;
        --ink-faint: #3a3630;
        --paper: #18160f;
        --paper-warm: #1e1b12;
        --accent: #c9433a;
        --rule: #2e2b22;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .masthead {
      padding-top: max(1.5rem, calc(env(safe-area-inset-top) + 1rem));
    }

    .masthead-inner {
      border-top: 3px double var(--ink);
      border-bottom: 1px solid var(--rule);
      padding: 0.5rem 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .masthead-title {
      font-family: var(--font-display);
      font-size: clamp(13px, 2.5vw, 15px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .masthead-date {
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
    }

    .tab-nav {
      display: flex;
      gap: 1.5rem;
      padding-top: 0.85rem;
    }

    .tab-link {
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      background: none;
      border: none;
      padding: 0 0 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-link:hover { color: var(--ink); }
    .tab-link.active { color: var(--accent); border-bottom-color: var(--accent); }

    .archive-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
      background: var(--paper-warm);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      margin-bottom: 1.75rem;
    }

    .archive-banner button {
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: none;
      border: none;
      font-style: normal;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .regenerate-row {
      padding: 1.25rem 0 0.5rem;
      text-align: center;
    }

    .text-link-btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-style: italic;
      color: var(--ink-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }

    .text-link-btn:hover { color: var(--accent); }

    .retry-btn {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink-mid);
      border: 1px solid var(--rule);
      background: none;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      margin-top: 0.75rem;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .retry-btn:hover { border-color: var(--ink-mid); color: var(--ink); }

    .archive-empty {
      font-size: 14px;
      color: var(--ink-light);
      font-style: italic;
      padding: 1rem 0;
    }

    .archive-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .archive-row:first-child { border-top: 1px solid var(--rule); }
    .archive-row:active { opacity: 0.6; }

    .archive-date-col {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light);
      min-width: 80px;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .archive-row-body { flex: 1; }

    .archive-row-headline {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.4;
    }

    .archive-row-domain {
      font-size: 11px;
      color: var(--accent);
      margin-top: 3px;
    }

    #view-main, #view-explore {
      padding-top: 2rem;
      padding-bottom: max(3rem, calc(env(safe-area-inset-bottom) + 2rem));
    }

    #view-explore { display: none; }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.75rem;
    }

    .domain-pill {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    .doorway-headline {
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .doorway-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.75;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .doorway-body p + p { margin-top: 0.85rem; }
    .doorway-sources {
      margin-top: 1rem;
      font-size: 12px;
      font-style: italic;
      color: var(--ink-light);
    }
    .doorway-sources a {
      color: var(--ink-mid);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
    }
    .doorway-sources a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .section-rule {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2rem 0;
    }

    .questions-list { list-style: none; }

    .question-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .question-row:first-child { border-top: 1px solid var(--rule); }
    .question-row:active { opacity: 0.6; }

    .question-tag {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-light);
      min-width: 80px;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .question-text {
      font-size: clamp(14px, 2.2vw, 16px);
      line-height: 1.5;
      color: var(--ink);
      flex: 1;
    }

    .question-arrow {
      color: var(--ink-faint);
      padding-top: 1px;
      flex-shrink: 0;
      transition: transform 0.15s, color 0.15s;
    }

    .question-row:hover .question-arrow { transform: translateX(3px); color: var(--accent); }
    .question-row.read .question-text { color: var(--ink-mid); }
    .question-row.read .question-arrow { color: var(--ink-light); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 1.75rem;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--ink); }

    .explore-question {
      font-family: var(--font-display);
      font-size: clamp(19px, 4vw, 25px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      color: var(--ink);
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .explore-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.8;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .explore-body p + p { margin-top: 1rem; }

    .explore-body h3 {
      font-family: var(--font-display);
      font-size: clamp(16px, 2.8vw, 19px);
      font-weight: 500;
      font-style: italic;
      color: var(--ink);
      margin: 1.75rem 0 0.6rem;
      line-height: 1.3;
    }

    .explore-status {
      margin-top: 1.25rem;
      font-size: 12px;
      font-style: italic;
      color: var(--ink-light);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .text-link-btn.inline { font-size: inherit; font-style: inherit; padding: 0; color: var(--accent); }

    .explore-note {
      margin-top: 1.25rem;
      font-size: 12px;
      font-style: italic;
      color: var(--ink-light);
    }

    .cite { font-size: 0.65em; line-height: 0; margin-left: 1px; }
    .cite a {
      color: var(--accent);
      text-decoration: none;
      padding: 0 1px;
    }
    .cite a + a::before { content: ","; color: var(--ink-light); }

    .explore-sources {
      margin-top: 2.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    .explore-sources ol {
      padding-left: 1.4rem;
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink-light);
    }
    .explore-sources a {
      color: var(--ink-mid);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      word-break: break-word;
    }
    .explore-sources a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .search-suggestions { margin-top: 1rem; max-width: 100%; overflow-x: auto; }

    .detour-section {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }

    .detour-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.85rem;
    }

    .detour-chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .detour-chip {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 300;
      color: var(--ink-mid);
      border: 1px solid var(--rule);
      background: none;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .detour-chip:hover { border-color: var(--ink-mid); color: var(--ink); }
    .detour-chip:active { background: var(--paper-warm); }

    .reflection {
      margin-top: 2.5rem;
      padding: 1.25rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--paper-warm);
    }

    .reflection-prompt {
      font-family: var(--font-display);
      font-size: clamp(15px, 2.5vw, 17px);
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }

    .reflection-sub {
      font-size: 13px;
      color: var(--ink-light);
      font-weight: 300;
      line-height: 1.6;
    }

    .skeleton {
      background: var(--paper-warm);
      border-radius: 2px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .sk-hl  { height: 32px; width: 88%; margin-bottom: 10px; }
    .sk-hl2 { height: 32px; width: 62%; margin-bottom: 20px; }
    .sk-ln  { height: 14px; margin-bottom: 10px; }
    .w-100  { width: 100%; }
    .w-85   { width: 85%; }
    .w-72   { width: 72%; }

    .sk-row {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      align-items: center;
    }
    .sk-row:first-child { border-top: 1px solid var(--rule); }
    .sk-tag { height: 10px; width: 70px; flex-shrink: 0; }
    .sk-q   { height: 14px; flex: 1; }

    .error-msg {
      font-size: 15px;
      color: var(--ink-light);
      font-style: italic;
      line-height: 1.7;
      padding: 1rem 0;
    }

    .error-detail {
      display: block;
      margin-top: 0.5rem;
      font-size: 12px;
      opacity: 0.6;
      font-style: normal;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead-inner">
        <span class="masthead-title">The Daily Expedition</span>
        <span class="masthead-date" id="js-date"></span>
      </div>
      <nav class="tab-nav">
        <button class="tab-link active" id="js-tab-today" onclick="showToday()">Today</button>
        <button class="tab-link" id="js-tab-archive" onclick="showArchiveList()">Archive</button>
      </nav>
    </header>

    <main id="view-main">
      <div id="js-archive-banner" class="archive-banner" style="display:none"></div>

      <section id="js-doorway" style="padding-top:2rem">
        <div class="skeleton sk-hl"></div>
        <div class="skeleton sk-hl2"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-85"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-72"></div>
      </section>

      <hr class="section-rule" style="margin-top:2rem" />

      <section style="padding-bottom:1rem">
        <p class="eyebrow">Threads worth pulling</p>
        <ul class="questions-list" id="js-questions">
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-85"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-72"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-85"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q w-72"></div></li>
        </ul>
      </section>

      <section id="js-regenerate" style="padding-bottom:2rem"></section>
    </main>

    <div id="view-archive" style="display:none;padding-top:2rem;padding-bottom:max(3rem,calc(env(safe-area-inset-bottom)+2rem))">
      <p class="eyebrow">Past expeditions</p>
      <div id="js-archive-list"></div>
    </div>

    <div id="view-explore" style="display:none;padding-top:2rem;padding-bottom:max(3rem,calc(env(safe-area-inset-bottom)+2rem))">
      <button class="back-btn" onclick="backFromExplore()">← Back</button>
      <div id="js-explore-content"></div>
    </div>
  </div>

  <script>
    // ---- State ----
    let expedition = null;        // the expedition currently shown in view-main
    let todayExpedition = null;   // today's live expedition, independent of what's on screen
    let viewingArchiveDate = null; // null = today's live expedition; else a 'YYYY-MM-DD' archive key
    let explorePrevScreen = 'today'; // where the back button from view-explore should return to

    const ARCHIVE_KEY = 'expedition-archive';
    const ARCHIVE_LIMIT = 14;
    const EXPLORATIONS_KEY = 'expedition-explorations';
    const EXPLORATIONS_LIMIT = 60;

    const DETOURS = [
      'Simply explained',
      'Go technical',
      'Economic lens',
      'Historical roots',
      'Opposing views',
      'Second-order effects',
      'Public debate',
    ];

    // Local calendar date (YYYY-MM-DD) — toISOString() would roll over at UTC midnight
    function todayKeyDate() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // Date
    (function() {
      const d = new Date();
      document.getElementById('js-date').textContent =
        d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    })();

    // API calls
    async function fetchWithTimeout(url, options, ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms || 28000);
      try {
        return await fetch(url, { ...(options || {}), signal: controller.signal });
      } catch (err) {
        if (err.name === 'AbortError') throw new Error('Request timed out. Please try again.');
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    // Prompts and the day's story live server-side; the client names a date, question, and lens
    async function apiRequest(url, options, ms) {
      const res = await fetchWithTimeout(url, options, ms);
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (data && data.error) throw new Error(data.error);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      if (!data) throw new Error('Unexpected response from server.');
      return data;
    }

    // Validate the shape of an expedition before trusting it in the UI
    function validateExpedition(data) {
      if (!data || typeof data !== 'object') throw new Error('Response was not a JSON object.');
      for (const key of ['headline', 'domain_tag', 'doorway']) {
        if (!data[key] || typeof data[key] !== 'string') {
          throw new Error(`Response is missing "${key}".`);
        }
      }
      if (!Array.isArray(data.questions) || data.questions.length !== 6) {
        throw new Error('Response did not include exactly 6 questions.');
      }
      for (const q of data.questions) {
        if (!q || typeof q.tag !== 'string' || !q.tag.trim() || typeof q.text !== 'string' || !q.text.trim()) {
          throw new Error('One or more questions is missing a tag or text.');
        }
      }
      return data;
    }

    // Today's expedition is usually built at 6am; the first request of the day builds it otherwise (up to ~40s)
    async function fetchExpedition(dateKey) {
      const data = await apiRequest('/api/expedition?date=' + encodeURIComponent(dateKey), null, 58000);
      return validateExpedition(data);
    }

    async function requestNewExpedition(dateKey) {
      const data = await apiRequest('/api/expedition', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: dateKey }),
      }, 58000);
      return validateExpedition(data);
    }

    // ---- Archive (rolling local history of past daily doorways) ----
    function getArchive() {
      try {
        const raw = localStorage.getItem(ARCHIVE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return {};
      }
    }

    function saveToArchive(dateKey, data) {
      const archive = getArchive();
      archive[dateKey] = {
        headline: data.headline,
        domain_tag: data.domain_tag,
        doorway: data.doorway,
        questions: data.questions,
        sources: data.sources || [],
        signals: data.signals || null,
        savedAt: Date.now(),
      };
      const keys = Object.keys(archive).sort().reverse();
      for (const key of keys.slice(ARCHIVE_LIMIT)) delete archive[key];
      try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive)); } catch (_) {}
    }

    // ---- Skeletons ----
    function doorwaySkeletonHtml() {
      return `
        <div class="skeleton sk-hl"></div>
        <div class="skeleton sk-hl2"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-85"></div>
        <div class="skeleton sk-ln w-100"></div>
        <div class="skeleton sk-ln w-72"></div>
      `;
    }

    function questionsSkeletonHtml() {
      const widths = ['', 'w-85', 'w-72', 'w-85', '', 'w-72'];
      return widths.map(w => `
        <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q ${w}"></div></li>
      `).join('');
    }

    // ---- Render: doorway / questions ----
    function formatArchiveDate(dateKey) {
      const d = new Date(dateKey + 'T00:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function renderDoorway(data, archived) {
      document.getElementById('js-doorway').innerHTML = `
        <p class="eyebrow">${archived ? 'From the archive' : "Today's doorway"}</p>
        <span class="domain-pill">${esc(data.domain_tag)}</span>
        <h1 class="doorway-headline">${esc(data.headline)}</h1>
        <div class="doorway-body"><p>${esc(data.doorway)}</p></div>
        ${sourcesHtml(data.sources)}
      `;
    }

    function sourcesHtml(sources) {
      const links = (sources || [])
        .filter(s => /^https?:\/\//.test(s.url || ''))
        .map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(s.source)}</a>`);
      return links.length ? `<p class="doorway-sources">Reported by ${links.join(' · ')}</p>` : '';
    }

    function renderQuestions(data) {
      const dateKey = viewingArchiveDate || todayKeyDate();
      document.getElementById('js-questions').innerHTML = data.questions.map((q, i) => {
        const read = hasReadQuestion(dateKey, data.headline, i);
        return `
        <li class="question-row${read ? ' read' : ''}" onclick="openQuestion(${i})" role="button" tabindex="0"
            onkeydown="if(event.key==='Enter')openQuestion(${i})">
          <span class="question-tag">${esc(q.tag)}</span>
          <span class="question-text">${esc(q.text)}</span>
          <span class="question-arrow" ${read ? 'title="Read"' : ''}>${read ? '✓' : '→'}</span>
        </li>
      `;
      }).join('');
    }

    function renderArchiveBanner() {
      const banner = document.getElementById('js-archive-banner');
      if (!viewingArchiveDate) {
        banner.style.display = 'none';
        banner.innerHTML = '';
        return;
      }
      banner.style.display = 'flex';
      banner.innerHTML = `
        <span>Viewing ${esc(formatArchiveDate(viewingArchiveDate))}</span>
        <button onclick="showToday()">Today →</button>
      `;
    }

    function renderRegenerateControl() {
      const el = document.getElementById('js-regenerate');
      el.innerHTML = viewingArchiveDate ? '' : `
        <div class="regenerate-row">
          <button class="text-link-btn" onclick="regenerate()">Not feeling this story? Try a different one →</button>
        </div>
      `;
    }

    function renderDoorwayError(err) {
      document.getElementById('js-doorway').innerHTML = `
        <p class="error-msg">The expedition couldn't load today — this is usually a configuration issue.
          Double-check that both API keys are set in your Netlify environment variables.
          <span class="error-detail">${esc(err.message)}</span>
        </p>
        <button class="retry-btn" onclick="loadToday()">Try again</button>
      `;
      document.getElementById('js-questions').innerHTML = '';
      document.getElementById('js-regenerate').innerHTML = '';
    }

    // ---- View state machine ----
    function setActiveTab(tab) {
      document.getElementById('js-tab-today').classList.toggle('active', tab === 'today');
      document.getElementById('js-tab-archive').classList.toggle('active', tab === 'archive');
    }

    function showScreen(name) {
      document.getElementById('view-main').style.display = name === 'main' ? 'block' : 'none';
      document.getElementById('view-archive').style.display = name === 'archive-list' ? 'block' : 'none';
      document.getElementById('view-explore').style.display = name === 'explore' ? 'block' : 'none';
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function showToday() {
      viewingArchiveDate = null;
      expedition = todayExpedition;
      setActiveTab('today');
      showScreen('main');
      if (expedition) {
        renderArchiveBanner();
        renderDoorway(expedition, false);
        renderQuestions(expedition);
        renderRegenerateControl();
      }
    }

    function showArchiveList() {
      setActiveTab('archive');
      showScreen('archive-list');
      const archive = getArchive();
      const keys = Object.keys(archive).sort().reverse();
      const listEl = document.getElementById('js-archive-list');
      if (!keys.length) {
        listEl.innerHTML = '<p class="archive-empty">Nothing here yet — expeditions you complete will collect here for easy revisiting.</p>';
        return;
      }
      listEl.innerHTML = keys.map(key => {
        const item = archive[key];
        return `
          <div class="archive-row" onclick="showArchiveDetail('${key}')" role="button" tabindex="0"
               onkeydown="if(event.key==='Enter')showArchiveDetail('${key}')">
            <span class="archive-date-col">${esc(formatArchiveDate(key))}</span>
            <div class="archive-row-body">
              <div class="archive-row-headline">${esc(item.headline)}</div>
              <div class="archive-row-domain">${esc(item.domain_tag)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showArchiveDetail(dateKey) {
      const archive = getArchive();
      const item = archive[dateKey];
      if (!item) { showArchiveList(); return; }
      viewingArchiveDate = dateKey;
      expedition = item;
      setActiveTab('archive');
      showScreen('main');
      renderArchiveBanner();
      renderDoorway(item, true);
      renderQuestions(item);
      renderRegenerateControl();
    }

    // ---- Loading today's expedition ----
    function cacheToday(data) {
      todayExpedition = data;
      try { localStorage.setItem('expedition-' + todayKeyDate(), JSON.stringify(data)); } catch (_) {}
      saveToArchive(todayKeyDate(), data);
    }

    async function loadToday(fetcher) {
      document.getElementById('js-doorway').innerHTML = doorwaySkeletonHtml();
      document.getElementById('js-questions').innerHTML = questionsSkeletonHtml();
      document.getElementById('js-regenerate').innerHTML = '';
      try {
        cacheToday(await (fetcher || fetchExpedition)(todayKeyDate()));
        showToday();
      } catch (err) {
        renderDoorwayError(err);
      }
    }

    // After rendering from cache, pick up a story swapped on another device.
    // Only redraws if the reader is still looking at today's doorway.
    async function refreshTodayInBackground() {
      try {
        const fresh = await fetchExpedition(todayKeyDate());
        const changed = !todayExpedition || fresh.headline !== todayExpedition.headline
          || (fresh.sources || []).length !== (todayExpedition.sources || []).length;
        if (!changed) return;
        const onTodayScreen = !viewingArchiveDate && document.getElementById('view-main').style.display !== 'none';
        cacheToday(fresh);
        if (onTodayScreen) showToday();
      } catch (_) {
        // Cached copy is still perfectly readable; try again next open.
      }
    }

    async function regenerate() {
      if (viewingArchiveDate) return;
      const ok = confirm("Load a different story for today? This replaces today's expedition on all your devices.");
      if (!ok) return;
      await loadToday(requestNewExpedition);
    }

    // ---- Reading history: finished explorations, kept only in this browser ----
    // (Google's grounding terms allow keeping answers as the reader's own history,
    // not caching them for others — so this never goes to the server.)
    function explorationKey(dateKey, headline, idx, lens) {
      return [dateKey, headline, idx, lens || ''].join('|');
    }

    function getExplorations() {
      try {
        const raw = localStorage.getItem(EXPLORATIONS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return {};
      }
    }

    function saveExploration(key, result) {
      const all = getExplorations();
      all[key] = {
        text: result.text,
        marks: result.marks || [],
        citations: result.citations || [],
        searchSuggestions: result.searchSuggestions || '',
        grounded: result.grounded,
        truncated: result.truncated,
        savedAt: Date.now(),
      };
      // Keep what the archive can still reach, newest first, within a size budget
      const oldest = new Date(Date.now() - ARCHIVE_LIMIT * 86400000).toISOString().slice(0, 10);
      const keys = Object.keys(all)
        .filter(k => k.slice(0, 10) >= oldest)
        .sort((a, b) => all[b].savedAt - all[a].savedAt);
      let kept = keys.slice(0, EXPLORATIONS_LIMIT);
      for (;;) {
        try {
          localStorage.setItem(EXPLORATIONS_KEY, JSON.stringify(Object.fromEntries(kept.map(k => [k, all[k]]))));
          return;
        } catch (_) {
          if (kept.length <= 1) return; // storage unavailable or full — reading still works
          kept = kept.slice(0, Math.ceil(kept.length / 2));
        }
      }
    }

    // Read if any lens of this question was explored (keys share the "date|headline|idx|" prefix)
    function hasReadQuestion(dateKey, headline, idx) {
      const prefix = explorationKey(dateKey, headline, idx, '');
      return Object.keys(getExplorations()).some(k => k.startsWith(prefix));
    }

    // ---- Explorations (streamed from /api/explore as newline-delimited JSON) ----
    let exploreController = null; // aborts an in-flight stream when the reader moves on
    let exploreRun = 0;           // lets queued redraws from an earlier or finished stream bow out

    async function streamExploration(payload, onText) {
      if (exploreController) exploreController.abort();
      const controller = exploreController = new AbortController();
      const timer = setTimeout(() => controller.abort('timeout'), 60000);
      let text = '';
      const fail = (message) => Object.assign(new Error(message), { partial: text });
      try {
        const res = await fetch('/api/explore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        if (!(res.headers.get('content-type') || '').includes('ndjson')) {
          let data = null;
          try { data = await res.json(); } catch (_) {}
          throw fail((data && data.error) || 'Request failed: ' + res.status);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let finished = null;
        for (;;) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split('\n');
          buffer = done ? '' : lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === 'text') { text += event.text; onText(text); }
            else if (event.type === 'done') finished = event;
            else if (event.type === 'error') throw fail(event.error);
          }
          if (done) break;
        }
        if (!finished) throw fail('The answer was cut short. Please try again.');
        return { ...finished, text };
      } catch (err) {
        if (controller.signal.aborted) {
          throw Object.assign(fail(controller.signal.reason === 'timeout' ? 'Request timed out. Please try again.' : 'Cancelled.'), { cancelled: controller.signal.reason !== 'timeout' });
        }
        throw err.partial !== undefined ? err : fail(err.message);
      } finally {
        clearTimeout(timer);
        if (exploreController === controller) exploreController = null;
      }
    }

    async function openQuestion(idx, detour, askAgain) {
      const q = expedition.questions[idx];
      explorePrevScreen = viewingArchiveDate ? 'archive-detail' : 'today';
      detour = detour || null;

      showScreen('explore');

      const label = detour ? `${detour} — ${q.text}` : q.text;
      const content = document.getElementById('js-explore-content');
      const run = ++exploreRun;
      const dateKey = viewingArchiveDate || todayKeyDate();
      const historyKey = explorationKey(dateKey, expedition.headline, idx, detour);

      const saved = !askAgain && getExplorations()[historyKey];
      if (saved) {
        if (exploreController) exploreController.abort();
        renderExploration(q, saved, idx, detour, saved.savedAt);
        return;
      }

      content.innerHTML = `
        <p class="explore-question">${esc(label)}</p>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-85" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-72" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-100" style="margin-bottom:10px"></div>
        <div class="skeleton sk-ln w-85"></div>
        <p class="explore-status">Searching the web…</p>
      `;

      // Redraw at most once per frame while text streams in. Frames can fire late
      // (browsers hold them while a tab is hidden), so one queued before the stream
      // finished must not paint over the final render — hence the run check.
      let pending = null;
      const onText = (text) => {
        if (pending) { pending = text; return; }
        pending = text;
        requestAnimationFrame(() => {
          if (run !== exploreRun || pending === null) return;
          content.innerHTML = `
            <p class="explore-question">${esc(label)}</p>
            <div class="explore-body">${proseHtml(pending, [])}</div>
            <p class="explore-status">Writing…</p>
          `;
          pending = null;
        });
      };

      try {
        const result = await streamExploration({
          date: dateKey,
          headline: expedition.headline,
          questionIndex: idx,
          lens: detour || null,
          // Only used for archive days saved before the server kept its own copy
          doorway: expedition.doorway,
          question: q.text,
        }, onText);
        if (run !== exploreRun) return;
        exploreRun++;
        saveExploration(historyKey, result);
        renderExploration(q, result, idx, detour);
      } catch (err) {
        if (err.cancelled || run !== exploreRun) return;
        exploreRun++;
        const retryArgs = idx + (detour ? `,'${escAttr(detour)}'` : '');
        content.innerHTML = `
          <p class="explore-question">${esc(label)}</p>
          ${err.partial ? `<div class="explore-body">${proseHtml(err.partial, [])}</div>` : ''}
          <p class="error-msg">${err.partial ? 'The rest of this exploration didn\'t arrive.' : 'Could not load this exploration.'}
            <span class="error-detail">${esc(err.message)}</span>
          </p>
          <button class="retry-btn" onclick="openQuestion(${retryArgs})">Try again</button>
        `;
      }
    }

    // Paragraphs and subheadings from Gemini's light markdown, with citation
    // markers inserted at the character positions the server computed.
    function proseHtml(rawText, marks) {
      let text = rawText;
      for (const m of [...(marks || [])].sort((a, b) => b.at - a.at)) {
        text = text.slice(0, m.at) + '' + m.refs.join(',') + '' + text.slice(m.at);
      }
      return text
        .replace(/\r\n/g, '\n')
        .split(/\n{2,}/)
        .map(block => {
          const t = block.trim();
          if (!t) return '';
          if (/^#{1,3}\s+/.test(t)) return `<h3>${esc(t.replace(/^#{1,3}\s+/, ''))}</h3>`;
          return `<p>${esc(t.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1'))}</p>`;
        })
        .filter(Boolean).join('\n')
        .replace(/([\d,]+)/g, (_, refs) =>
          `<sup class="cite">${refs.split(',').map(n => `<a href="#" onclick="return jumpToCitation(${Number(n)})">${Number(n)}</a>`).join('')}</sup>`);
    }

    function formatSavedAt(ts) {
      const d = new Date(ts);
      const sameDay = d.toDateString() === new Date().toDateString();
      return sameDay
        ? 'earlier today, ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
        : 'on ' + d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function jumpToCitation(n) {
      const el = document.getElementById('cite-' + n);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return false;
    }

    function sourcesListHtml(result) {
      const items = (result.citations || [])
        .filter(c => /^https?:\/\//.test(c.url || ''))
        .map(c => `<li id="cite-${Number(c.n)}"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a></li>`)
        .join('');
      const hasSuggestions = !!result.searchSuggestions;
      if (!items && !hasSuggestions) return '';
      return `
        <div class="explore-sources">
          ${items ? `<p class="detour-label">Sources</p><ol>${items}</ol>` : ''}
          ${hasSuggestions ? '<div class="search-suggestions" id="js-search-suggestions"></div>' : ''}
        </div>
      `;
    }

    function renderExploration(q, result, idx, detour, savedAt) {
      const chips = DETOURS
        .filter(d => d !== detour)
        .map(d => `<button class="detour-chip" onclick="openQuestion(${idx},'${escAttr(d)}')">${esc(d)}</button>`)
        .join('');

      const notes = [];
      const askAgainArgs = `${idx},${detour ? `'${escAttr(detour)}'` : 'null'},true`;
      if (result.grounded === false) notes.push('Written without a live web search — Google Search grounding was unavailable just now.');
      if (result.truncated) notes.push('This exploration reached its length limit and may end abruptly.');

      const content = document.getElementById('js-explore-content');
      content.innerHTML = `
        <p class="explore-question">${esc(detour ? detour + ' — ' + q.text : q.text)}</p>
        <div class="explore-body">${proseHtml(result.text, result.marks)}</div>
        ${notes.map(n => `<p class="explore-note">${esc(n)}</p>`).join('')}
        ${savedAt ? `<p class="explore-note">From your reading ${esc(formatSavedAt(savedAt))} ·
          <button class="text-link-btn inline" onclick="openQuestion(${askAgainArgs})">Ask again</button></p>` : ''}
        ${sourcesListHtml(result)}
        <div class="detour-section">
          <p class="detour-label">Explore through a different lens</p>
          <div class="detour-chips">${chips}</div>
        </div>
        <div class="reflection">
          <p class="reflection-prompt">"What do you understand now that you didn't understand this morning?"</p>
          <p class="reflection-sub">The expedition is most valuable when it changes how you see a system — not just what you know about an event.</p>
        </div>
      `;

      // Google requires its Search Suggestions to be shown, unmodified, with grounded
      // answers. A shadow root keeps its bundled CSS from clashing with the page's.
      const host = document.getElementById('js-search-suggestions');
      if (host && result.searchSuggestions) {
        host.attachShadow({ mode: 'open' }).innerHTML = result.searchSuggestions;
      }
    }

    function backFromExplore() {
      if (exploreController) exploreController.abort();
      if (explorePrevScreen === 'archive-detail' && viewingArchiveDate) {
        showArchiveDetail(viewingArchiveDate);
      } else {
        showToday();
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function escAttr(str) { return String(str).replace(/'/g, "\\'"); }

    async function init() {
      const todayKey = 'expedition-' + todayKeyDate();

      // Clean up stale daily-cache entries — never touch the archive key
      const dateKeyPattern = /^expedition-\d{4}-\d{2}-\d{2}$/;
      for (const key of Object.keys(localStorage)) {
        if (dateKeyPattern.test(key) && key !== todayKey) {
          localStorage.removeItem(key);
        }
      }

      // Try loading today's cache first
      try {
        const cached = localStorage.getItem(todayKey);
        if (cached) {
          todayExpedition = validateExpedition(JSON.parse(cached));
          saveToArchive(todayKeyDate(), todayExpedition);
          showToday();
          refreshTodayInBackground();
          return;
        }
      } catch (_) {}

      // Nothing cached (or cache was invalid) — fetch from the server
      await loadToday();
    }

    init();
  </script>
</body>
</html>
