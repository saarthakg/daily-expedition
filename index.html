<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Expedition" />
  <title>The Daily Expedition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #1a1814;
      --ink-mid: #4a4640;
      --ink-light: #8a857e;
      --ink-faint: #c8c3bc;
      --paper: #f9f6f0;
      --paper-warm: #f2ede4;
      --paper-card: #ffffff;
      --accent: #8b1a1a;
      --accent-light: #c9433a;
      --rule: #d8d2c8;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --max: 680px;
      --pad: clamp(1.25rem, 5vw, 2.5rem);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8df;
        --ink-mid: #b8b2a8;
        --ink-light: #7a756e;
        --ink-faint: #3a3630;
        --paper: #18160f;
        --paper-warm: #1e1b12;
        --paper-card: #221f16;
        --accent: #c9433a;
        --accent-light: #e06055;
        --rule: #2e2b22;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    /* ── Masthead ── */
    .masthead {
      padding-top: env(safe-area-inset-top, 0px);
      padding-top: max(1.5rem, calc(env(safe-area-inset-top) + 1rem));
    }

    .masthead-inner {
      border-top: 3px double var(--ink);
      border-bottom: 1px solid var(--rule);
      padding: 0.5rem 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .masthead-title {
      font-family: var(--font-display);
      font-size: clamp(13px, 2.5vw, 15px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .masthead-date {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
      white-space: nowrap;
    }

    /* ── Views ── */
    #view-main, #view-explore {
      padding-top: 2rem;
      padding-bottom: max(3rem, calc(env(safe-area-inset-bottom) + 2rem));
    }

    #view-explore { display: none; }

    /* ── Section labels ── */
    .eyebrow {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-light);
      font-weight: 400;
      margin-bottom: 0.75rem;
    }

    /* ── Doorway ── */
    .domain-pill {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    .doorway-headline {
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .doorway-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.75;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .doorway-body p + p { margin-top: 0.85rem; }

    /* ── Rule ── */
    .section-rule {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2rem 0;
    }

    .section-rule.thick {
      border-top: 1px solid var(--ink-faint);
    }

    /* ── Questions list ── */
    .questions-list { list-style: none; }

    .question-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .question-row:first-child { border-top: 1px solid var(--rule); }
    .question-row:active { opacity: 0.6; }

    .question-tag {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-light);
      min-width: 80px;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .question-text {
      font-family: var(--font-body);
      font-size: clamp(14px, 2.2vw, 16px);
      line-height: 1.5;
      color: var(--ink);
      font-weight: 400;
      flex: 1;
    }

    .question-arrow {
      color: var(--ink-faint);
      font-size: 18px;
      padding-top: 1px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .question-row:hover .question-arrow,
    .question-row:active .question-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* ── Explore view ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 1.75rem;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--ink); }

    .back-arrow { font-size: 14px; }

    .explore-question {
      font-family: var(--font-display);
      font-size: clamp(19px, 4vw, 25px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      color: var(--ink);
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .explore-body {
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.8;
      color: var(--ink-mid);
      font-weight: 300;
    }

    .explore-body p + p { margin-top: 1rem; }

    .explore-body h3 {
      font-family: var(--font-display);
      font-size: clamp(16px, 2.8vw, 19px);
      font-weight: 500;
      font-style: italic;
      color: var(--ink);
      margin: 1.75rem 0 0.6rem;
      line-height: 1.3;
    }

    /* ── Detours ── */
    .detour-section {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }

    .detour-label {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.85rem;
    }

    .detour-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detour-chip {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 300;
      color: var(--ink-mid);
      border: 1px solid var(--rule);
      background: none;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .detour-chip:hover {
      border-color: var(--ink-mid);
      color: var(--ink);
    }

    .detour-chip:active {
      background: var(--paper-warm);
    }

    /* ── Reflection box ── */
    .reflection {
      margin-top: 2.5rem;
      padding: 1.25rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--paper-warm);
    }

    .reflection-prompt {
      font-family: var(--font-display);
      font-size: clamp(15px, 2.5vw, 17px);
      font-style: italic;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }

    .reflection-sub {
      font-size: 13px;
      color: var(--ink-light);
      font-weight: 300;
      line-height: 1.6;
    }

    /* ── Loading skeleton ── */
    .skeleton {
      background: var(--paper-warm);
      border-radius: 2px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .sk-headline {
      height: 32px;
      width: 88%;
      margin-bottom: 10px;
    }

    .sk-headline-2 {
      height: 32px;
      width: 62%;
      margin-bottom: 20px;
    }

    .sk-line {
      height: 14px;
      margin-bottom: 10px;
    }

    .sk-short { width: 85%; }
    .sk-full  { width: 100%; }
    .sk-mid   { width: 72%; }

    .sk-row {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      align-items: center;
    }

    .sk-row:first-child { border-top: 1px solid var(--rule); }
    .sk-tag { height: 10px; width: 70px; flex-shrink: 0; }
    .sk-q { height: 14px; flex: 1; }

    /* ── Error ── */
    .error-msg {
      font-size: 15px;
      color: var(--ink-light);
      font-style: italic;
      line-height: 1.7;
      padding: 1rem 0;
    }

    .error-detail {
      display: block;
      margin-top: 0.5rem;
      font-size: 12px;
      opacity: 0.6;
      font-style: normal;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Masthead -->
    <header class="masthead">
      <div class="masthead-inner">
        <span class="masthead-title">The Daily Expedition</span>
        <span class="masthead-date" id="js-date"></span>
      </div>
    </header>

    <!-- Main view: doorway + questions -->
    <main id="view-main">

      <!-- Doorway -->
      <section id="js-doorway">
        <div class="skeleton sk-headline"></div>
        <div class="skeleton sk-headline-2"></div>
        <div class="skeleton sk-line sk-full"></div>
        <div class="skeleton sk-line sk-short"></div>
        <div class="skeleton sk-line sk-full"></div>
        <div class="skeleton sk-line sk-mid"></div>
        <div class="skeleton sk-line sk-short"></div>
      </section>

      <hr class="section-rule thick" style="margin-top: 2rem;" />

      <!-- Questions -->
      <section>
        <p class="eyebrow">Threads worth pulling</p>
        <ul class="questions-list" id="js-questions">
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q" style="width:60%"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q" style="width:80%"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q" style="width:55%"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q" style="width:75%"></div></li>
          <li class="sk-row"><div class="skeleton sk-tag"></div><div class="skeleton sk-q" style="width:65%"></div></li>
        </ul>
      </section>

    </main>

    <!-- Explore view: deep dive on a question -->
    <div id="view-explore">
      <button class="back-btn" onclick="showMain()" aria-label="Back to today's expedition">
        <span class="back-arrow">←</span> Today's expedition
      </button>
      <div id="js-explore-content"></div>
    </div>

  </div><!-- /page -->

  <script>
    // ─── State ───────────────────────────────────────────────────────────────
    let expedition = null;   // { headline, domain_tag, doorway, questions[] }
    let activeQ    = null;   // index of current question
    let activeD    = null;   // current detour label or null

    const DETOURS = [
      'Simply explained',
      'Go technical',
      'Economic lens',
      'Historical roots',
      'Opposing views',
      'Second-order effects',
    ];

    // ─── Date ────────────────────────────────────────────────────────────────
    (function setDate() {
      const d = new Date();
      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('js-date').textContent = d.toLocaleDateString('en-US', opts);
    })();

    // ─── API helpers ─────────────────────────────────────────────────────────
    async function fetchNews() {
      const res = await fetch('/.netlify/functions/news');
      if (!res.ok) throw new Error('News fetch failed: ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.news || [];
    }

    async function callGemini(systemPrompt, userPrompt) {
      const res = await fetch('/.netlify/functions/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemPrompt, userPrompt }),
      });
      if (!res.ok) throw new Error('Gemini call failed: ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.text || '';
    }

    // ─── Build expedition ────────────────────────────────────────────────────
    async function buildExpedition(articles) {
      const digest = articles
        .slice(0, 20)
        .map((a, i) => `${i + 1}. [${(a.category || []).join(', ')}] ${a.title}`)
        .join('\n');

      const today = new Date().toDateString();

      const systemPrompt = `You are the editor of The Daily Expedition — a calm, intellectually serious daily briefing. Your reader is educated and broadly curious across geopolitics, economics, technology, science, energy, infrastructure, history, and culture.

Today is ${today}. You have been given a list of real headlines from today's news. Your task:

1. Choose the single most intellectually rich story — one that connects to larger systems, has historical depth, and opens multiple avenues of exploration. Avoid pure politics or sports.
2. Write a compelling doorway into that story.
3. Generate six genuinely interesting questions it opens.

Respond ONLY with valid JSON — no markdown, no backticks, no explanation before or after:
{
  "headline": "A sharp, newspaper-quality headline (not clickbait, not a question)",
  "domain_tag": "one of: Geopolitics | Economics | Technology | Science | Energy | Infrastructure | Culture | History",
  "doorway": "Three to four sentences. Set the scene with authority. What happened, why it matters to the wider world, what is genuinely uncertain or consequential. Write like a senior correspondent, not a press release. No bullet points.",
  "questions": [
    { "tag": "Historical",   "text": "A question about how history led to this moment" },
    { "tag": "Systemic",     "text": "A question about the larger system or mechanism at play" },
    { "tag": "Geopolitical", "text": "A question about actors, power, and incentives" },
    { "tag": "Economic",     "text": "A question about market forces or financial consequences" },
    { "tag": "Scientific",   "text": "A question about the underlying technology or science" },
    { "tag": "Wildcard",     "text": "An unexpected adjacent question that becomes fascinating because of this event" }
  ]
}`;

      const userPrompt = `Here are today's headlines. Choose the best doorway and generate the expedition:\n\n${digest}`;

      const raw = await callGemini(systemPrompt, userPrompt);

      // Strip any accidental markdown fences
      const cleaned = raw.replace(/```json|```/gi, '').trim();
      const match = cleaned.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('No JSON found in Gemini response.');
      return JSON.parse(match[0]);
    }

    // ─── Render doorway ──────────────────────────────────────────────────────
    function renderDoorway(data) {
      document.getElementById('js-doorway').innerHTML = `
        <p class="eyebrow" style="margin-bottom:0.6rem">Today's doorway</p>
        <span class="domain-pill">${data.domain_tag}</span>
        <h1 class="doorway-headline">${escHtml(data.headline)}</h1>
        <div class="doorway-body"><p>${escHtml(data.doorway)}</p></div>
      `;
    }

    // ─── Render questions ────────────────────────────────────────────────────
    function renderQuestions(data) {
      const items = data.questions.map((q, i) => `
        <li class="question-row" onclick="openQuestion(${i})" role="button" tabindex="0"
            aria-label="Explore: ${escHtml(q.text)}"
            onkeydown="if(event.key==='Enter'||event.key===' ')openQuestion(${i})">
          <span class="question-tag">${escHtml(q.tag)}</span>
          <span class="question-text">${escHtml(q.text)}</span>
          <span class="question-arrow" aria-hidden="true">→</span>
        </li>
      `).join('');
      document.getElementById('js-questions').innerHTML = items;
    }

    // ─── Open a question ─────────────────────────────────────────────────────
    async function openQuestion(idx, detour) {
      activeQ = idx;
      activeD = detour || null;

      const q = expedition.questions[idx];

      // Switch view
      document.getElementById('view-main').style.display = 'none';
      document.getElementById('view-explore').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Show loading state
      document.getElementById('js-explore-content').innerHTML = `
        <p class="explore-question">${escHtml(detour ? detour + ' — ' + q.text : q.text)}</p>
        <div class="skeleton sk-line sk-full" style="margin-bottom:10px"></div>
        <div class="skeleton sk-line sk-short" style="margin-bottom:10px"></div>
        <div class="skeleton sk-line sk-full" style="margin-bottom:10px"></div>
        <div class="skeleton sk-line sk-mid" style="margin-bottom:10px"></div>
        <div class="skeleton sk-line sk-full" style="margin-bottom:10px"></div>
        <div class="skeleton sk-line sk-short"></div>
      `;

      const detourInstructions = {
        'Simply explained':    'Explain this for a curious, intelligent non-specialist. Use concrete analogies. Avoid jargon.',
        'Go technical':        'Go deeper into the technical or scientific mechanisms. Assume a well-educated reader who wants precision.',
        'Economic lens':       'Focus on the economic dimensions — incentives, market structures, costs, trade-offs, and financial consequences.',
        'Historical roots':    'Ground this in history. How did we arrive here? What are the deep roots and historical precedents?',
        'Opposing views':      'Present the genuine tensions and disagreements. Where do serious, thoughtful people disagree, and why?',
        'Second-order effects':'Think through downstream consequences. What might this change over the next 5–20 years? What seems obvious but might be wrong?',
      };

      const lensNote = detour
        ? `\n\nLens for this response: ${detourInstructions[detour] || detour}`
        : '';

      const systemPrompt = `You are a brilliant, measured intellectual guide for The Daily Expedition. You write with the depth and craft of a long-form magazine feature — flowing prose, not bullet points, not listicles.

Today's event: "${expedition.headline}"
Context: ${expedition.doorway}

Write 4–6 substantive paragraphs exploring the question. Use subheadings only if you need them for genuine structure (not decoration). Every paragraph should reveal something — connect the specific to the systemic, the present to the past. End your final paragraph with one sentence that opens a new direction of thought, leaving the reader slightly unsettled in a good way.${lensNote}`;

      const userPrompt = `Explore this question with depth and care:\n\n"${q.text}"`;

      try {
        const answer = await callGemini(systemPrompt, userPrompt);
        renderExploration(q, answer, idx, detour);
      } catch (err) {
        document.getElementById('js-explore-content').innerHTML = `
          <p class="explore-question">${escHtml(q.text)}</p>
          <p class="error-msg">Something went wrong loading this exploration.
            <span class="error-detail">${escHtml(err.message)}</span>
          </p>
        `;
      }
    }

    // ─── Render exploration ──────────────────────────────────────────────────
    function renderExploration(q, rawText, idx, detour) {
      // Convert plain newlines to paragraphs, handle basic markdown headings
      const html = rawText
        .replace(/\r\n/g, '\n')
        .split(/\n{2,}/)
        .map(block => {
          const trimmed = block.trim();
          if (!trimmed) return '';
          if (/^###\s+/.test(trimmed)) {
            return `<h3>${escHtml(trimmed.replace(/^###\s+/, ''))}</h3>`;
          }
          if (/^##\s+/.test(trimmed)) {
            return `<h3>${escHtml(trimmed.replace(/^##\s+/, ''))}</h3>`;
          }
          if (/^#\s+/.test(trimmed)) {
            return `<h3>${escHtml(trimmed.replace(/^#\s+/, ''))}</h3>`;
          }
          // Remove any stray markdown bold/italic markers for cleanliness
          const clean = trimmed
            .replace(/\*\*(.*?)\*\*/g, '$1')
            .replace(/\*(.*?)\*/g, '$1');
          return `<p>${escHtml(clean)}</p>`;
        })
        .filter(Boolean)
        .join('\n');

      const availableDetours = DETOURS.filter(d => d !== detour);
      const chips = availableDetours.map(d => `
        <button class="detour-chip" onclick="openQuestion(${idx}, '${escAttr(d)}')">${escHtml(d)}</button>
      `).join('');

      document.getElementById('js-explore-content').innerHTML = `
        <p class="explore-question">${escHtml(detour ? detour + ' — ' + q.text : q.text)}</p>
        <div class="explore-body">${html}</div>
        <div class="detour-section">
          <p class="detour-label">Explore through a different lens</p>
          <div class="detour-chips">${chips}</div>
        </div>
        <div class="reflection">
          <p class="reflection-prompt">"What do you understand now that you didn't understand this morning?"</p>
          <p class="reflection-sub">The expedition is most valuable when it changes how you see a system — not just what you know about an event.</p>
        </div>
      `;
    }

    // ─── Navigation ──────────────────────────────────────────────────────────
    function showMain() {
      document.getElementById('view-explore').style.display = 'none';
      document.getElementById('view-main').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // ─── Utilities ───────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escAttr(str) {
      return String(str).replace(/'/g, "\\'");
    }

    // ─── Init ────────────────────────────────────────────────────────────────
    async function init() {
      try {
        const articles = await fetchNews();
        if (!articles.length) throw new Error('No articles returned from news API.');
        expedition = await buildExpedition(articles);
        renderDoorway(expedition);
        renderQuestions(expedition);
      } catch (err) {
        document.getElementById('js-doorway').innerHTML = `
          <p class="error-msg">
            The expedition couldn't load today — this is usually a configuration issue.
            Double-check that both API keys are set in your Netlify environment variables.
            <span class="error-detail">${escHtml(err.message)}</span>
          </p>
        `;
        document.getElementById('js-questions').innerHTML = '';
      }
    }

    init();
  </script>
</body>
</html>
