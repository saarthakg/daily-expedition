[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # @netlify/blobs needs Node 22.12+; functions run on the build's Node version
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Browsers must re-check the service worker on every visit so updates roll out
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
